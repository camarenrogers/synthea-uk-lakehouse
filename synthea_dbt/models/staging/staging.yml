version: 2

models:
  - name: stg_patients
    description: "One row per patient, cleaned and renamed."
    columns:
      - name: patient_id
        description: "Unique patient identifier."
        data_tests:
          - unique
          - not_null

  - name: stg_encounters
    description: "One row per clinical encounter."
    columns:
      - name: encounter_id
        data_tests:
          - unique
          - not_null
      - name: patient_id
        description: "Links to stg_patients."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_patients')
              field: patient_id